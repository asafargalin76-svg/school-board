


<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Школьное табло — звёздное небо</title>
    <style>
      body {
        margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
        color: #ffffff; font-family: "Times New Roman", serif;
        display: flex; flex-direction: column; position: relative;
        background-color: #000000;
      }
      /* Звёзды поверх чёрного фона */
      .stars::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
        background-image: radial-gradient(white, white 1px, transparent 2px),
          radial-gradient(white, white 1px, transparent 2px),
          radial-gradient(white, white 1px, transparent 2px);
        background-size: 250px 250px, 180px 180px, 120px 120px;
        background-position: 0 0, 60px 40px, -30px 90px; opacity: 0.35;
      }

      .text-with-outline {
        color: #ffffff; text-shadow: -2px -2px 0 #4facf9, 2px -2px 0 #4facf9,
          -2px 2px 0 #4facf9, 2px 2px 0 #4facf9;
      }

      .top-line { padding: 20px; text-align: center; font-size: 3rem;
        letter-spacing: 2px; position: relative; z-index: 2; }
      .clock-block { text-align: center; margin-top: 10px; font-size: 7rem;
        font-weight: bold; line-height: 1.1; position: relative; z-index: 2; }
      .greeting-block { text-align: center; font-size: 3.2rem; font-weight: bold;
        opacity: 0; transition: opacity 0.4s ease; margin-top: 20px;
        position: relative; z-index: 2; }
      .greeting-block.visible { opacity: 1; }

      .morning-greeting { color: #ffd700; } .day-greeting   { color: #87ceeb; }
      .evening-greeting{ color: #ff8c69; } .night-greeting  { color: #a0a0ff; }

      .main-area { flex: 1; display: flex; flex-direction: column;
        justify-content: center; align-items: center; text-align: center;
        position: relative; z-index: 2; }
      .lesson-status { font-size: 5rem; font-weight: bold; color: #ff4444;
        text-shadow: 0 0 15px rgba(255, 68, 68, 0.8); margin-bottom: 40px; line-height: 1.2; }
      
      .timer-row {
  display: block;
  width: 100%;                /* Занимает всю доступную ширину */
  text-align: center;         /* Центрирует текст внутри этой ширины */
  font-size: 4.5rem;
  font-weight: bold;
  color: #e0e0e0;
  margin-top: 40px;          /* Чуть больше отступа для заметного разделения */
}
      .timer-value { color: #ffd66d; font-weight: 900; }

      .saturday-message { display: none; font-size: 4rem; color: #ffcc00;
        text-shadow: 0 0 20px rgba(255, 204, 0, 0.6); line-height: 1.3;
        max-width: 90%; position: relative; z-index: 2; }
      .friday-after-lessons { display: none; font-size: 4rem; color: #ffaa00;
        text-shadow: 0 0 20px rgba(255, 170, 0, 0.5); line-height: 1.3;
        max-width: 90%; position: relative; z-index: 2; }
#weather {
  position: absolute;
  bottom: 90px;          /* над бегущей строкой */
  left: 20px;
  font-size: 2rem;
  font-weight: bold;
  color: #ffd66d;
  text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
  z-index: 3;
}
      .marquee-container { position: absolute; bottom: 20px; left: 0;
        width: 100%; height: 60px; overflow: hidden; z-index: 3; }
      .marquee-track { display: inline-block; white-space: nowrap;
        animation: marquee 60s linear infinite; }
      @keyframes marquee {
  0% { transform: translateX(100vw); }
  100% { transform: translateX(-100%); }
}
      .marquee-text { font-family: "Times New Roman", serif; font-size: 3rem;
        color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
         letter-spacing: nowrap; }
    </style>
  </head>
  <body class="stars">
    <div class="top-line text-with-outline" id="dateLine">--.--.----, день недели</div>
    <div class="clock-block text-with-outline" id="clock">00:00:00</div>
    <div class="greeting-block" id="greeting"></div>

    <div class="main-area">
      <div class="lesson-status" id="lessonStatus"></div>

      <div class="timer-row text-with-outline">
        <span id="timerLabel">До перемены:</span>
        <span class="timer-value" id="timerValue">00:00</span>
      </div>

      <div class="saturday-message" id="saturdayMessage">Лови субботнее настроение — оно самое лучшее!</div>
      <div class="friday-after-lessons" id="fridayAfterLessons">После уроков в пятницу даже воздух пахнет выходными!</div>
    </div>

    <div class="marquee-container">
      <div class="marquee-track">
        <span class="marquee-text">-------------------</span>
      </div>
    </div>

    <script>
      const SCHEDULE_CONFIG = {
        lessonDurationMinutes: 40,
        breakDurationMinutes: 10,
        firstLessonStartHour: 8,
        firstLessonStartMinute: 45,
        maxLessons: 7,
      };

      const monthNames = [
        'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
        'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
      ];
      const weekdayNames = [
        'воскресенье', 'понедельник', 'вторник', 'среда',
        'четверг', 'пятница', 'суббота'
      ];

      function updateDate() {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const monthIndex = now.getMonth();
        const year = now.getFullYear();
        const weekdayIndex = now.getDay();
        document.getElementById('dateLine').textContent =
          `${day} ${monthNames[monthIndex]} ${year}, ${weekdayNames[weekdayIndex]}`;
      }

      function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock').textContent = `${h}:${m}:${s}`;
      }

      function checkGreeting() {
        const h = new Date().getHours();
        const el = document.getElementById('greeting');
        el.className = 'greeting-block';
        el.textContent = '';

        if (h >= 22 || h < 7) {
          el.textContent = 'Доброй ночи!';
          el.classList.add('night-greeting', 'visible');
        } else if (h >= 7 && h < 11) {
          el.textContent = 'Доброе утро!';
          el.classList.add('morning-greeting', 'visible');
        } else if (h >= 11 && h < 18) {
          el.textContent = 'Добрый день!';
          el.classList.add('day-greeting', 'visible');
        } else {
          el.textContent = 'Добрый вечер!';
          el.classList.add('evening-greeting', 'visible');
        }
      }

      function getLessonAndTimer(now) {
        const day = now.getDay();

        // Воскресенье: таймер до понедельника 8:45
        if (day === 0) {
          const startMonday = new Date(now);
          while (startMonday.getDay() !== 1) {
            startMonday.setDate(startMonday.getDate() + 1);
          }
          startMonday.setHours(8, 45, 0, 0);
          const diffToMonday = Math.floor((startMonday.getTime() - now.getTime()) / 1000);
          return {
            status: 'weekend',
            untilNext: diffToMonday,
            label: 'До первого урока в понедельник:',
            message: ''
          };
        }

        // Суббота: только сообщение
        if (day === 6) {
          return { status: 'saturday', untilNext: null, label: '', message: '' };
        }

        const startToday = new Date(now);
        startToday.setHours(SCHEDULE_CONFIG.firstLessonStartHour, SCHEDULE_CONFIG.firstLessonStartMinute, 0, 0);

        const lessonSec = SCHEDULE_CONFIG.lessonDurationMinutes * 60;
        const breakSec = SCHEDULE_CONFIG.breakDurationMinutes * 60;
        const maxLessons = SCHEDULE_CONFIG.maxLessons;

        let timeAfter7th = 0;
        for (let n = 1; n <= maxLessons; n++) {
          timeAfter7th += lessonSec;
          if (n < maxLessons) timeAfter7th += breakSec;
        }
        const endOf7th = new Date(startToday);
        endOf7th.setTime(endOf7th.getTime() + timeAfter7th * 1000);
        const isAfter7thToday = (now.getTime() >= endOf7th.getTime());

        // После 7-го урока: таймер до завтра 8:45 (или фраза для пятницы)
        if (isAfter7thToday) {
          const startTomorrow = new Date(startToday);
          startTomorrow.setDate(startTomorrow.getDate() + 1);
          startTomorrow.setHours(8, 45, 0, 0);
          const diffToTomorrow = Math.floor((startTomorrow.getTime() - now.getTime()) / 1000);

          if (day === 5) {
            return {
              status: 'friday-after',
              untilNext: diffToTomorrow,
              label: '',
              message: ''
            };
          }

          return {
            status: 'ended',
            untilNext: diffToTomorrow,
            label: 'До первого урока завтра:',
            message: '' 
          };
        }

        // Время от начала учебного дня
        const diffSeconds = Math.floor((now.getTime() - startToday.getTime()) / 1000);

        // До 8:45 — показываем таймер до первого урока
        if (diffSeconds < 0) {
          const untilFirstLesson = Math.abs(diffSeconds);
          return {
            status: 'before',
            untilNext: untilFirstLesson,
            label: 'До первого урока:',
            message: ''
          };
        }

        // Считаем уроки и перемены
        let timeLeftInCycle = diffSeconds;
        for (let n = 1; n <= maxLessons; n++) {
          if (timeLeftInCycle < lessonSec) {
            const untilBreak = lessonSec - timeLeftInCycle;
            return {
              status: 'lesson',
              untilNext: untilBreak,
              label: 'До перемены:',
              message: `Идет ${n}-й урок`
            };
          }
          timeLeftInCycle -= lessonSec;

          if (n < maxLessons) {
            if (timeLeftInCycle < breakSec) {
              const untilLesson = breakSec - timeLeftInCycle;
              return {
                status: 'break',
                untilNext: untilLesson,
                label: 'До звонка:',
                message: 'Перемена'
              };
            }
            timeLeftInCycle -= breakSec;
          }
        }

        return { status: 'fallback', untilNext: 0, label: '', message: '' };
      }

      function formatTimer(seconds) {
        if (!seconds || seconds < 0) return '00:00';
        if (seconds >= 3600) {
          const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
          const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
          const s = (seconds % 60).toString().padStart(2, '0');
          return `${h}:${m}:${s}`;
        }
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      function updateDisplay() {
        const now = new Date();
        updateDate();
        updateClock();
        checkGreeting();

        const { status, untilNext, label, message } = getLessonAndTimer(now);

        const lessonStatusEl = document.getElementById('lessonStatus');
        const timerRowEl = document.querySelector('.timer-row');
        const saturdayMsgEl = document.getElementById('saturdayMessage');
        const fridayMsgEl = document.getElementById('fridayAfterLessons');

        lessonStatusEl.style.display = 'none';
        timerRowEl.style.display = 'block';
        saturdayMsgEl.style.display = 'none';
        fridayMsgEl.style.display = 'none';

        if (status === 'saturday') {
          timerRowEl.style.display = 'none';
          saturdayMsgEl.style.display = 'block';
          return;
        }

        if (status === 'friday-after') {
          timerRowEl.style.display = 'none';
          fridayMsgEl.style.display = 'block';
          return;
        }

        if (status === 'weekend' || status === 'ended' || status === 'before') {
          document.getElementById('timerLabel').textContent = label;
          document.getElementById('timerValue').textContent = formatTimer(untilNext);
          lessonStatusEl.style.display = 'none';
          return;
        }

        document.getElementById('timerLabel').textContent = label;
        document.getElementById('timerValue').textContent = formatTimer(untilNext);
        lessonStatusEl.textContent = message;
        lessonStatusEl.style.display = 'block';
      }

      // Запускаем сразу и каждую секунду
      updateDisplay();
      setInterval(updateDisplay, 1000);
    </script>
    <script>
  function getMarqueeText() {
    const d = new Date();
    const day = d.getDate();
    const month = d.getMonth() + 1;

    if ((month === 12 && day === 31) || (month === 1 && day === 1)) {
      return "🎉 С НОВЫМ ГОДОМ! Пусть год будет ярким и успешным! 🎉";
    }
    if (month === 2 && day === 23) {
      return "🎖️ С 23 ФЕВРАЛЯ! С Днём защитника Отечества! 🎖️";
    }
    if (month === 3 && day === 8) {
      return "💐 С 8 МАРТА! Счастья, весны и улыбок! 💐";
    }
    return null; // обычный день — ничего не меняем
  }

  const text = getMarqueeText();
  if (text) {
    const m = document.querySelector('.marquee-text') || document.querySelector('.marquee-container');
    if (m) m.textContent = text;
  }
</script>
  </body>
</html>
